apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def testGameAssetsDir = layout.buildDirectory.dir('generated/testGameAssets')

android {
    namespace 'com.mgc.letobox.happy'
    compileSdkVersion project.compileSdkVersion

    defaultConfig {
        applicationId "com.mgc.letobox.happy"
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        versionCode 21
        versionName "2.0.1"
        multiDexEnabled true

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    signingConfigs{
        // 修改为您自己的签名, 并在微信后台设置签名指纹

//        debug {
//            storeFile file('./xxx')
//            storePassword "xxx"
//            keyAlias "xxxx"
//            keyPassword "xxxx"
//        }
//        release {
//            storeFile file('./xxxx')
//            storePassword "xxxxx"
//            keyAlias "xxxx"
//            keyPassword "xxxx"
//        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField 'boolean', 'ENABLE_MGC_MOCK_SERVER', 'true'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // 修改为您自己的签名, 并在微信后台设置签名指纹
//            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            buildConfigField 'boolean', 'ENABLE_MGC_MOCK_SERVER', 'false'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // 修改为您自己的签名, 并在微信后台设置签名指纹
//            signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = true
    }
    sourceSets {
        main {
            // Only the selected test APK is staged into generated assets.
            assets.srcDir testGameAssetsDir
        }
    }
    androidResources {
        noCompress += ['apk']
    }
}

tasks.register('prepareTestGameAssets', Copy) {
    from "$rootDir/apks/arrowc002.apk"
    into testGameAssetsDir
}

tasks.named('preBuild').configure {
    dependsOn 'prepareTestGameAssets'
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    // APK sandbox runtime, rebuilt against this app's legacy Support v4 API.
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Yasha 1.0.7 implements the legacy LayoutContainer marker at runtime.
    implementation "org.jetbrains.kotlin:kotlin-android-extensions-runtime:$kotlin_version"
    implementation "com.android.support:design:$project.supportLibVersion"
    implementation 'com.android.support.constraint:constraint-layout:1.1.1'
    implementation "com.android.support:cardview-v7:$project.supportLibVersion"
    implementation 'pub.devrel:easypermissions:1.0.1'
    implementation 'com.android.support:multidex:1.0.2'
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation 'io.reactivex.rxjava2:rxjava:2.2.10'
    implementation 'com.github.ssseasonnn:IronBranch:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "com.github.ssseasonnn:Yasha:1.0.7"
    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.4.1'
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'
    configurations {
        all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        all*.exclude group: 'com.google.code.gson'
    }
}
